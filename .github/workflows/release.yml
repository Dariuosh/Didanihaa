name: Build release package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/temp/nuget
      NPM_CONFIG_CACHE: ${{ github.workspace }}/temp/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: src/Didanihaa.Web/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Check public source and history
        run: ./tools/Test-Publication.ps1 -Revision HEAD -CheckHistory
      - name: Build portable package
        run: ./tools/Build-Release.ps1
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Didanihaa-win-x64-${{ github.sha }}
          path: |
            temp/releases/artifacts/*.zip
            temp/releases/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

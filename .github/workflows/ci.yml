name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/temp/nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: src/Didanihaa.WebUI/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Check publication policy and history
        run: ./tools/Test-Publication.ps1 -Revision HEAD -CheckHistory
      - name: Scan committed secrets
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $archive = Join-Path $directory 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expected = 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Gitleaks checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          & (Join-Path $directory 'gitleaks.exe') git . --log-opts=HEAD --redact=100 --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed.' }
      - name: Restore frontend
        working-directory: src/Didanihaa.WebUI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore locked NuGet packages
        run: dotnet restore Didanihaa.slnx --locked-mode
      - name: Build Release
        run: dotnet build Didanihaa.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution Didanihaa.slnx --configuration Release --no-build --no-restore --results-directory temp/test-results --timeout 2m
      - name: Test launcher state compatibility
        run: ./tests/Didanihaa.Tools.Tests/Runtime.Common.Tests.ps1
